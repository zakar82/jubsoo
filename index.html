<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>접수 앱</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--navy:#1f3a5f;--gold:#b8862b;--paper:#f7f4ec;--ink:#1c2430;--muted:#5b6574;--line:#ddd5c2;--ok:#1d6b43;--bad:#a12b2b}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:19px;line-height:1.6}
  header{background:var(--navy);color:#fff;padding:22px 20px 18px;padding-top:max(22px,env(safe-area-inset-top))}
  header h1{margin:0;font-size:1.45rem;line-height:1.3}
  header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
  main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  .tabs{display:flex;gap:8px;margin:4px 0 16px}
  .tabs button{flex:1;min-height:54px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:700;border-radius:12px}
  .tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  label{display:block;font-weight:700;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;min-height:54px;padding:12px 14px;font:inherit;border:2px solid #b9b19c;border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .go{width:100%;min-height:60px;margin-top:18px;border:0;border-radius:14px;background:var(--gold);color:#fff;font:inherit;font-size:1.1rem;font-weight:800}
  .go[disabled]{opacity:.55}
  .msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700;display:none}
  .msg.ok{display:block;background:#e5f3ea;color:var(--ok)}
  .msg.bad{display:block;background:#fbe8e8;color:var(--bad)}
  .big{font-size:3.2rem;font-weight:800;color:var(--navy);line-height:1.1}
  .sub{color:var(--muted);font-size:.9rem}
  .bar{height:16px;background:#ece6d6;border-radius:99px;overflow:hidden;margin:8px 0 2px}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s}
  .row{margin:14px 0}
  .row b{display:flex;justify-content:space-between}
  .hide{display:none!important}
  .install{background:#eef2f8;border:1px dashed var(--navy);border-radius:14px;padding:14px;font-size:.95rem}
  .install button{min-height:48px;padding:0 16px;margin-top:8px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700}
  .err{background:#fff6e0;border:1px solid #e3c779;border-radius:12px;padding:14px;font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1 id="title">접수 앱</h1>
  <p id="notice">잠시만 기다려 주세요…</p>
</header>

<main>
  <div class="tabs" role="tablist">
    <button id="tabForm" role="tab" aria-selected="true">접수하기</button>
    <button id="tabStat" role="tab" aria-selected="false">현황 보기</button>
  </div>

  <div id="problem" class="err hide"></div>

  <section id="panelForm" class="card">
    <form id="form" autocomplete="off" novalidate>
      <label for="name">이름</label>
      <input id="name" maxlength="30" placeholder="홍길동" required>

      <label for="group" id="groupLabel">소속</label>
      <select id="group"></select>

      <label for="phone">연락처 (선택)</label>
      <input id="phone" inputmode="tel" maxlength="30" placeholder="010-0000-0000">

      <label for="memo" id="memoLabel">내용</label>
      <textarea id="memo" maxlength="300" placeholder="적어 주세요"></textarea>

      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="go" id="send" type="submit">접수합니다</button>
      <div id="result" class="msg" role="status"></div>
    </form>
  </section>

  <section id="panelStat" class="card hide">
    <div class="sub">지금까지 접수</div>
    <div class="big"><span id="total">0</span><span style="font-size:1.4rem"> 건</span></div>
    <div id="goalBox" class="hide">
      <div class="bar"><i id="goalBar"></i></div>
      <div class="sub" id="goalText"></div>
    </div>
    <div id="groups"></div>
    <div class="sub" style="margin-top:16px" id="updated"></div>
    <div class="sub">이름은 이 화면에 나오지 않습니다.</div>
  </section>

  <div id="install" class="install hide"></div>
</main>

<script>
/* ============================================================
   이 줄만 고치면 됩니다 (깃허브로 올려서 쓰는 방식일 때)
   앱스 스크립트에서 배포한 '웹 앱 URL'을 작은따옴표 안에 붙여 넣으세요.
   예) var API_URL = 'https://script.google.com/macros/s/AKfy...../exec';
   앱스 스크립트 안에서 열어 쓰는 방식이면 비워 두세요.
   ============================================================ */
var API_URL = '';
/* ============================================================ */

var inGoogle = (typeof google !== 'undefined') && google.script && google.script.run;
var $ = function (id) { return document.getElementById(id); };

/* ----- 서버와 말 주고받기 (두 방식을 하나로 묶음) ----- */
function callServer(kind, payload) {
  return new Promise(function (resolve, reject) {
    if (inGoogle) {
      var fn = { config: 'apiConfig', status: 'apiStatus', submit: 'apiSubmit' }[kind];
      var run = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      kind === 'submit' ? run[fn](payload) : run[fn]();
      return;
    }
    if (!API_URL) { reject(new Error('NO_API_URL')); return; }
    if (kind === 'submit') {
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submit', data: payload }) })
        .then(function (r) { return r.json(); }).then(resolve).catch(reject);
    } else {
      fetch(API_URL + '?api=' + kind + '&t=' + Date.now())
        .then(function (r) { return r.json(); }).then(resolve).catch(reject);
    }
  });
}

function showProblem(err) {
  var box = $('problem');
  box.classList.remove('hide');
  box.textContent = (err && err.message === 'NO_API_URL')
    ? '아직 시트와 연결되지 않았습니다. index.html 위쪽의 API_URL 에 웹 앱 주소를 붙여 넣어 주세요.'
    : '시트와 연결하지 못했습니다. 인터넷 연결과 웹 앱 주소, 배포 설정(모든 사용자)을 확인해 주세요.';
}

/* ----- 설정 불러와 화면 채우기 ----- */
var config = { groups: [] };
function applyConfig(c) {
  config = c;
  document.title = c.title;
  $('title').textContent = c.title;
  $('notice').textContent = c.notice;
  $('groupLabel').textContent = c.groupLabel;
  $('memoLabel').textContent = c.memoLabel;
  var closed = c.open === false;
  $('send').disabled = closed;
  $('send').textContent = closed ? '접수가 마감되었습니다' : '접수합니다';
  var sel = $('group');
  sel.textContent = '';
  if (c.groups.length) {
    var first = document.createElement('option');
    first.value = ''; first.textContent = '선택해 주세요';
    sel.appendChild(first);
    c.groups.forEach(function (g) {
      var o = document.createElement('option');
      o.value = g; o.textContent = g; sel.appendChild(o);
    });
    $('groupLabel').classList.remove('hide'); sel.classList.remove('hide');
  } else {
    $('groupLabel').classList.add('hide'); sel.classList.add('hide');
  }
}

/* ----- 접수 ----- */
$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var res = $('result');
  res.className = 'msg';
  var data = {
    name: $('name').value.trim(), group: $('group').value, phone: $('phone').value.trim(),
    memo: $('memo').value.trim(), website: $('website').value
  };
  if (!data.name) { res.textContent = '이름을 적어 주세요.'; res.className = 'msg bad'; return; }
  if (config.groups.length && !data.group) { res.textContent = config.groupLabel + '을(를) 골라 주세요.'; res.className = 'msg bad'; return; }
  var btn = $('send'); btn.disabled = true; btn.textContent = '보내는 중…';
  callServer('submit', data).then(function (r) {
    res.textContent = r.message; res.className = 'msg ' + (r.ok ? 'ok' : 'bad');
    if (r.ok) { $('name').value = ''; $('phone').value = ''; $('memo').value = ''; }
  }).catch(function (e) {
    res.textContent = '보내지 못했습니다. 잠시 후 다시 눌러 주세요.'; res.className = 'msg bad';
  }).then(function () { var closed = config.open === false; btn.disabled = closed; btn.textContent = closed ? '접수가 마감되었습니다' : '접수합니다'; });
});

/* ----- 현황 ----- */
function drawStatus(s) {
  $('total').textContent = s.total;
  var gb = $('goalBox');
  if (s.goal > 0) {
    gb.classList.remove('hide');
    var pct = Math.min(100, Math.round(s.total / s.goal * 100));
    $('goalBar').style.width = pct + '%';
    $('goalText').textContent = '목표 ' + s.goal + '건 중 ' + pct + '%';
  } else { gb.classList.add('hide'); }
  var box = $('groups'); box.textContent = '';
  var max = Math.max.apply(null, [1].concat(s.groups.map(function (g) { return g.count; })));
  s.groups.forEach(function (g) {
    var row = document.createElement('div'); row.className = 'row';
    var b = document.createElement('b');
    var n = document.createElement('span'); n.textContent = g.name;
    var c = document.createElement('span'); c.textContent = g.count + '건';
    b.appendChild(n); b.appendChild(c);
    var bar = document.createElement('div'); bar.className = 'bar';
    var i = document.createElement('i'); i.style.width = Math.round(g.count / max * 100) + '%';
    bar.appendChild(i); row.appendChild(b); row.appendChild(bar); box.appendChild(row);
  });
  $('updated').textContent = '마지막 확인: ' + s.updated;
}
var timer = null;
function loadStatus() {
  callServer('status').then(drawStatus).catch(showProblem);
}

/* ----- 탭 ----- */
function pick(which) {
  var form = which === 'form';
  $('panelForm').classList.toggle('hide', !form);
  $('panelStat').classList.toggle('hide', form);
  $('tabForm').setAttribute('aria-selected', String(form));
  $('tabStat').setAttribute('aria-selected', String(!form));
  clearInterval(timer);
  if (!form) { loadStatus(); timer = setInterval(loadStatus, 60000); }
}
$('tabForm').onclick = function () { pick('form'); };
$('tabStat').onclick = function () { pick('stat'); };

/* ----- 홈 화면 설치 ----- */
var deferred = null;
var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function showInstall(html, withButton) {
  var box = $('install');
  box.textContent = '';
  var p = document.createElement('div'); p.textContent = html; box.appendChild(p);
  if (withButton) {
    var b = document.createElement('button'); b.textContent = '홈 화면에 설치';
    b.onclick = function () { deferred.prompt(); deferred.userChoice.then(function () { box.classList.add('hide'); deferred = null; }); };
    box.appendChild(b);
  }
  box.classList.remove('hide');
}
if (!inGoogle && !standalone) {
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    showInstall('휴대폰 바탕화면에 앱처럼 설치해 두면 더 빨리 열립니다.', true);
  });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    showInstall('아이폰: 사파리 아래쪽 공유 버튼(□↑)을 누르고 [홈 화면에 추가]를 선택하세요.', false);
  }
}
if (!inGoogle && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

/* ----- 시작 ----- */
callServer('config').then(applyConfig).catch(function (e) {
  $('notice').textContent = '';
  showProblem(e);
});
</script>
</body>
</html>
